<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Instrument Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --sidebar-border: #e0e0e0;
            --text-color: #333;
            --selected-bg: #e6f7ff;
            --selected-border: #91d5ff;
            --hover-bg: #f5f5f5;
            --header-color: #1a237e;
            --button-bg: #1a73e8;
            --button-text: #ffffff;
            --input-border: #ccc;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --navbar-bg: #ffffff;
            --navbar-text: #555;
        }

        body.dark-mode {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --sidebar-border: #333;
            --text-color: #f5f5f5;
            --selected-bg: #2a3a50;
            --selected-border: #4a6a8a;
            --hover-bg: #2c2c2c;
            --header-color: #bb86fc;
            --button-bg: #3700b3;
            --button-text: #ffffff;
            --input-border: #555;
            --card-bg: #1e1e1e;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            --navbar-bg: #1e1e1e;
            --navbar-text: #ccc;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }


        .content {
            flex: 1;
            padding: 30px;
            position: relative;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #chart-title {
            color: var(--header-color);
            margin-bottom: 20px;
            font-size: 24px;
        }

        #candlestick-chart {
            width: 100%;
            height: 800px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            background-color: var(--card-bg);
            margin-bottom: 20px;
            position: relative;
            /* Add this to position controls */
        }

        #chart-controls-container {
            position: absolute;
            /* Position the controls relative to the chart */
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode #chart-controls-container {
            background-color: rgba(30, 30, 30, 0.8);
        }

        #chart-controls-container label {
            font-weight: 500;
        }

        #chart-controls-container select,
        #chart-controls-container button,
        #chart-controls-container input[type="checkbox"] {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid var(--input-border);
            background-color: var(--sidebar-bg);
            color: var(--text-color);
        }

        #chart-controls-container button {
            background-color: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        #chart-controls-container button:hover {
            background-color: #1565c0;
        }

        #instrumentSearch {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        #hover-details {
            position: absolute;
            top: 100px;
            right: 50px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            display: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .trades-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            margin-top: 20px;
        }

        .trades-container h3 {
            margin: 0 0 15px 0;
            color: var(--header-color);
        }

        #trades-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #trades-list li {
            padding: 10px;
            border-bottom: 1px solid var(--sidebar-border);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #trades-list li:hover {
            background-color: var(--hover-bg);
        }

        #trades-list li:last-child {
            border-bottom: none;
        }

        .placeholder-text {
            text-align: center;
            color: #888;
            margin: 20px 0;
        }

        .trade-side.buy {
            color: #186118;
            font-weight: bold;
        }

        .trade-side.sell {
            color: #D50000;
            font-weight: bold;
        }

        .trade-quantity,
        .trade-price,
        .trade-time {
            color: var(--text-color);
        }

        .notification-popup {
            position: absolute;
            top: 50px;
            /* adjust based on navbar */
            right: 20px;
            width: 300px;
            max-height: 400px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow-y: auto;
            z-index: 1000;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .notification-list {
            padding: 10px;
        }

        .notification-item {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 8px;
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item:hover {
            background: #e0f7ff;
        }


        .notification-item.unread {
            font-weight: bold;
            background-color: #d0f0ff;
        }

        /* Read notifications: normal text + muted background */
        .notification-item.read {
            font-weight: normal;
            background-color: #f9f9f9;
            color: #555;
        }
    </style>
</head>

<body>
    {% include "include/navbar.html" %}
    <div id="notification-popup" class="notification-popup" style="display: none;">
        <div class="popup-header">
            <h4>Notifications</h4>
            <span id="close-popup" style="cursor:pointer;">&times;</span>
        </div>
        <div id="notification-list" class="notification-list">
            <!-- Notifications will be appended here dynamically -->
        </div>
    </div>
    <div class="main-container">
        {% include "include/sidebar.html" %}

        <div class="content">
            <h3 id="chart-title">Select an instrument to view chart</h3>

            <div id="candlestick-chart">
                <div id="chart-controls-container">
                    <label>Interval:
                        <select id="intervalSelect">
                            <option value="1m">1 min</option>
                            <option value="3m">3 min</option>
                            <option value="5m">5 min</option>
                            <option value="30m">30 min</option>
                            <option value="1h">1 hour</option>
                        </select>
                    </label>

                    <label>
                        <input type="checkbox" id="themeToggle"> Dark Mode
                    </label>

                    <button onclick="resetZoom()">Reset Zoom</button>
                    <label>
                        <input type="checkbox" id="toggleCandles" checked> Show Candles
                    </label>
                </div>
            </div>

            <div id="hover-details"></div>

            <div class="trades-container" id="trades-container">
                <h3>Recent Trades</h3>
                <ul id="trades-list">
                    <p class="placeholder-text">Select an instrument to view trades.</p>
                </ul>
            </div>
        </div>
    </div>

    <script>
        let selectedInstrument = null;
        let currentTheme = 'light';
        let socket = null;
        const chartDiv = document.getElementById('candlestick-chart');


        const allTraces = [
            finalCandles = {
                x: [],
                open: [],
                high: [],
                low: [],
                close: [],
                type: 'candlestick',
                name: 'Final Candles',
                hoverinfo: 'none',
                increasing: { line: { color: '#186118', width: 1.5 }, fillcolor: '#186118' },
                decreasing: { line: { color: '#D50000', width: 1.5 }, fillcolor: '#D50000' }
            },
            liveCandleTrace = {
                x: [],
                open: [],
                high: [],
                low: [],
                close: [],
                type: 'candlestick',
                name: 'Live Candle',
                hoverinfo: 'none',
                increasing: { line: { color: '#186118', width: 1.5 }, fillcolor: '#186118' },
                decreasing: { line: { color: '#D50000', width: 1.5 }, fillcolor: '#D50000' }
            },
            tradeMarkers = {
                x: [],
                y: [],
                mode: 'markers+text',
                type: 'scatter',
                name: 'Trade',
                text: [],
                hoverinfo: 'none',
                textposition: 'top center',
                marker: { color: 'orange', size: 10, symbol: 'circle' }
            }
        ];

        const layoutBase = {
            dragmode: 'pan',
            margin: { r: 10, t: 25, b: 40, l: 60, b: 80 },
            showlegend: false,
            hovermode: 'x',
            yaxis: {
                title: 'Price',
                fixedrange: false,
                tickformat: ',.2f',
                gridcolor: 'rgba(0,0,0,0.01)'
            },
            xaxis: {
                title: 'Time',
                type: 'date',
                fixedrange: false,
                autorange: true,
                gridcolor: 'rgba(0,0,0,0.01)',
                tickangle: -45,
                tickformat: '%I:%M %p',
                nticks: 10,
                rangeslider: {
                    visible: false
                }
            }
        };

        function formatDateTime(dateObj) {
            const options = {
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            };
            return dateObj.toLocaleString('en-US', options);
        }

        function formatTradeTime(dateObj) {
            const hours = String(dateObj.getHours()).padStart(2, '0');
            const minutes = String(dateObj.getMinutes()).padStart(2, '0');
            const seconds = String(dateObj.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function setupHoverListeners() {
            const chartDiv = document.getElementById('candlestick-chart');
            const detailsDiv = document.getElementById('hover-details');

            chartDiv.on('plotly_hover', (eventData) => {
                if (eventData.points && eventData.points.length > 0) {
                    const point = eventData.points[0];
                    const trace = allTraces[point.curveNumber];
                    const pointIndex = point.pointIndex;

                    if (!trace || !trace.open || trace.open[pointIndex] === undefined) {
                        detailsDiv.style.display = 'none';
                        return;
                    }

                    const time = trace.x[pointIndex];
                    const open = trace.open[pointIndex];
                    const high = trace.high[pointIndex];
                    const low = trace.low[pointIndex];
                    const close = trace.close[pointIndex];

                    detailsDiv.innerHTML = `
                        <b>Time:</b> ${time}<br>
                        <b>Open:</b> ${open.toFixed(2)}<br>
                        <b>High:</b> ${high.toFixed(2)}<br>
                        <b>Low:</b> ${low.toFixed(2)}<br>
                        <b>Close:</b> ${close.toFixed(2)}
                    `;
                    detailsDiv.style.display = 'block';
                }
            });

            chartDiv.on('plotly_unhover', () => {
                detailsDiv.style.display = 'none';
            });
        }


        function updateLive1mCandle(data) {
            const live = data.live_candle;
            const prev = data.prev_candle;

            if (!live || !prev) {
                console.error("Invalid live candle data format received for 1m.");
                return;
            }

            // Convert timestamps properly (handles ISO or epoch)
            const finalTime = isNaN(prev.datetime)
                ? new Date(prev.datetime)
                : new Date(parseInt(prev.datetime));
            const liveTime = isNaN(live.datetime)
                ? new Date(live.datetime)
                : new Date(parseInt(live.datetime));

            liveTime.setSeconds(0, 0);

            // FIX: ensure Date conversion before .getTime()
            const lastCandleTime = finalCandles.x.length > 0
                ? new Date(finalCandles.x[finalCandles.x.length - 1]).getTime()
                : null;

            if (lastCandleTime === null || finalTime.getTime() > lastCandleTime) {
                const newPoint = {
                    x: [[finalTime]],
                    open: [[prev.open]],
                    high: [[prev.high]],
                    low: [[prev.low]],
                    close: [[prev.close]]
                };
                Plotly.extendTraces(chartDiv, newPoint, [0]);
            }

            const liveCandleUpdate = {
                x: [[liveTime]],
                open: [[live.open]],
                high: [[live.high]],
                low: [[live.low]],
                close: [[live.close]]
            };
            Plotly.restyle(chartDiv, liveCandleUpdate, [1]);
        }

        function updateLive3mCandle(live3mCandleData) {
            if (!live3mCandleData || !live3mCandleData.datetime) {
                console.error("Invalid 3m candle data received. 'datetime' field is missing.");
                return;
            }

            let liveTime;
            // If datetime is numeric-like (epoch string or number)
            if (!isNaN(live3mCandleData.datetime)) {
                const epoch = parseInt(live3mCandleData.datetime, 10);
                // Detect if it's in seconds or milliseconds
                liveTime = new Date(epoch > 1e12 ? epoch : epoch * 1000);
            } else {
                // Already in "YYYY-MM-DD HH:mm:ss" format
                liveTime = new Date(live3mCandleData.datetime.replace(" ", "T"));
            }

            if (isNaN(liveTime.getTime())) {
                console.error("Failed to parse datetime:", live3mCandleData.datetime);
                return;
            }

            const liveCandleUpdate = {
                x: [[liveTime]],
                open: [[live3mCandleData.open]],
                high: [[live3mCandleData.high]],
                low: [[live3mCandleData.low]],
                close: [[live3mCandleData.close]]
            };

            Plotly.restyle(chartDiv, liveCandleUpdate, [1]);
        }


        function fetchTrade(data) {
            if (!data) return;

            const ceTrade = data.CE;
            const peTrade = data.PE;

            tradeMarkers.x = [
                formatDateTime(new Date(ceTrade.datetime * 1000)),
                formatDateTime(new Date(peTrade.datetime * 1000))
            ];

            tradeMarkers.y = [ceTrade.high, peTrade.low];
            tradeMarkers.text = ['CE', 'PE'];

            Plotly.restyle('candlestick-chart', {
                x: [finalCandles.x, liveCandleTrace.x, tradeMarkers.x],
                y: [undefined, undefined, tradeMarkers.y],
                text: [undefined, undefined, tradeMarkers.text]
            });
        }

        function updateChartData() {
            if (!selectedInstrument) return;

            const intervalValue = document.getElementById('intervalSelect').value;
            const intervalNumber = parseInt(intervalValue);
            const intervalUnitChar = intervalValue.replace(/[0-9]/g, '');
            const unitMap = { m: 'minutes', h: 'hours' };
            const unitFull = unitMap[intervalUnitChar] || 'minutes';

            const intradayUrl = '/chart/';
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ instrument_key: selectedInstrument, interval: intervalNumber, unit: unitFull })
            };

            fetch(intradayUrl, options)
                .then(r => r.json())
                .then(intradayData => {
                    if (!Array.isArray(intradayData)) {
                        console.error("Data is not in the expected array format for update.");
                        return;
                    }

                    const combinedData = intradayData.map(d => ({ ...d, datetime: new Date(d.datetime) }));
                    combinedData.sort((a, b) => a.datetime.getTime() - b.datetime.getTime());

                    if (finalCandles.x.length !== combinedData.length ||
                        (finalCandles.x.length > 0 && finalCandles.x[finalCandles.x.length - 1].getTime() !== combinedData[combinedData.length - 1].datetime.getTime())) {

                        finalCandles.x = combinedData.map(d => d.datetime);
                        finalCandles.open = combinedData.map(d => d.open);
                        finalCandles.high = combinedData.map(d => d.high);
                        finalCandles.low = combinedData.map(d => d.low);
                        finalCandles.close = combinedData.map(d => d.close);

                        Plotly.restyle(chartDiv, {
                            x: [finalCandles.x],
                            open: [finalCandles.open],
                            high: [finalCandles.high],
                            low: [finalCandles.low],
                            close: [finalCandles.close]
                        }, [0]);
                    }
                })
                .catch(error => {
                    console.error('Error fetching or updating data:', error);
                });
        }

        function fetchCandles() {
            if (!selectedInstrument) return;

            const intervalValue = document.getElementById('intervalSelect').value;
            const intervalNumber = parseInt(intervalValue);
            const intervalUnitChar = intervalValue.replace(/[0-9]/g, '');
            const unitMap = { m: 'minutes', h: 'hours' };
            const unitFull = unitMap[intervalUnitChar] || 'minutes';

            const intradayUrl = '/chart/';

            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ instrument_key: selectedInstrument, interval: intervalNumber, unit: unitFull })
            };

            fetch(intradayUrl, options)
                .then(r => r.json())
                .then(intradayData => {
                    if (!Array.isArray(intradayData)) {
                        console.error("Data is not in the expected array format.");
                        return;
                    }

                    const combinedData = [...intradayData];

                    finalCandles.x = combinedData.map(d => d.datetime);
                    finalCandles.open = combinedData.map(d => d.open);
                    finalCandles.high = combinedData.map(d => d.high);
                    finalCandles.low = combinedData.map(d => d.low);
                    finalCandles.close = combinedData.map(d => d.close);

                    const chartDiv = document.getElementById('candlestick-chart');

                    if (chartDiv.data) {
                        // 🔹 Use update instead of restyle to preserve layout/zoom
                        Plotly.update(chartDiv, {
                            x: [finalCandles.x, liveCandleTrace.x, tradeMarkers.x],
                            open: [finalCandles.open, liveCandleTrace.open],
                            high: [finalCandles.high, liveCandleTrace.high],
                            low: [finalCandles.low, liveCandleTrace.low],
                            close: [finalCandles.close, liveCandleTrace.close],
                            y: [null, null, tradeMarkers.y],
                            text: [null, null, tradeMarkers.text]
                        }, {}, [0, 1, 2]);
                    } else {
                        const initialLayout = {
                            ...layoutBase,
                            xaxis: {
                                ...layoutBase.xaxis,
                                categoryarray: finalCandles.x
                            },
                            paper_bgcolor: currentTheme === 'dark' ? '#1e1e1e' : '#ffffff',
                            plot_bgcolor: currentTheme === 'dark' ? '#1e1e1e' : '#ffffff',
                            font: { color: currentTheme === 'dark' ? '#f5f5f5' : '#333' }
                        };
                        Plotly.newPlot(chartDiv, [finalCandles, liveCandleTrace, tradeMarkers], initialLayout, { scrollZoom: true, staticPlot: false, displayModeBar: false });
                        setupHoverListeners();
                    }
                })
                .catch(error => {
                    console.error('Error fetching or combining data:', error);
                });
        }


        function getCookie(name) {
            const v = `; ${document.cookie}`.split(`; ${name}=`);
            return v.length === 2 ? v.pop().split(';')[0] : undefined;
        }

        function resetZoom() {
            Plotly.relayout('candlestick-chart', { 'xaxis.autorange': true, 'yaxis.autorange': true });
        }

        function loadChart(instrumentKey, element) {
            selectedInstrument = instrumentKey;

            const allItems = document.querySelectorAll('.index-list li');
            allItems.forEach(item => item.classList.remove('selected'));
            if (element) {
                element.classList.add('selected');
            }

            document.getElementById("chart-title").innerText = instrumentKey;

            const now = new Date();
            if (now.getHours() === 10 && now.getMinutes() === 30) {
                document.getElementById('intervalSelect').value = '3m';
            }

            fetchCandles();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "set_instruments",
                    instrumentKeys: [instrumentKey]
                }));
            }
            if (!socket) {
                socket = new WebSocket(`ws://127.0.0.1:8000/ws/trade-data/NSE_INDEX_Nifty_50/`);
                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        const intervalValue = document.getElementById('intervalSelect').value;

                        if (intervalValue === '3m' && data.candle_3m) {
                            updateLive3mCandle(data.candle_3m);
                        } else if (intervalValue === '1m' && data.live_candle) {
                            updateLive1mCandle(data);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                };
                socket.onopen = () => console.log('WebSocket connected');
                socket.onerror = err => console.error('WebSocket error:', err);
                socket.onclose = () => console.warn('WebSocket closed');
            }
        }

        document.getElementById('themeToggle').addEventListener('change', e => {
            currentTheme = e.target.checked ? 'dark' : 'light';
            document.body.classList.toggle('dark-mode', e.target.checked);

            const chartDiv = document.getElementById('candlestick-chart');
            if (chartDiv.data) {
                Plotly.relayout(chartDiv, {
                    paper_bgcolor: currentTheme === 'dark' ? '#1e1e1e' : '#ffffff',
                    plot_bgcolor: currentTheme === 'dark' ? '#1e1e1e' : '#ffffff',
                    font: { color: currentTheme === 'dark' ? '#f5f5f5' : '#333' }
                });
            }
        });

        document.getElementById('toggleCandles').addEventListener('change', e => {
            Plotly.restyle('candlestick-chart', { visible: e.target.checked ? true : 'legendonly' }, 0);
            Plotly.restyle('candlestick-chart', { visible: e.target.checked ? true : 'legendonly' }, 1);
        });

        document.getElementById('intervalSelect').addEventListener('change', () => {
            fetchCandles();
            fetchTrades();
        });

        document.getElementById('instrumentSearch').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const listItems = document.querySelectorAll('.index-list li');
            listItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });
        const now = new Date();
        if (now.getHours() > 10 || (now.getHours() === 10 && now.getMinutes() >= 30)) {
            document.getElementById('intervalSelect').value = '3m';
        }

        setInterval(fetchCandles, 30000); // every 30 sec

    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notificationBtn = document.getElementById('notification-btn');
            const popup = document.getElementById('notification-popup');
            const closeBtn = document.getElementById('close-popup');
            const notificationList = document.getElementById('notification-list');
            const notificationCount = document.getElementById('notification-count');

            // Function to fetch and render notifications
            const loadNotifications = () => {
                fetch('/notifications/')
                    .then(response => response.json())
                    .then(data => {
                        notificationList.innerHTML = ''; // Clear existing
                        const notifications = data.notifications || [];

                        if (notifications.length > 0) {
                            notifications.forEach(notif => {
                                const div = document.createElement('div');
                                div.className = 'notification-item';
                                div.classList.add(notif.is_read ? 'read' : 'unread');

                                div.innerHTML = `
                            <strong>${notif.content}</strong><br>
                            Instrument: ${notif.instrument || 'N/A'}
                        `;

                                div.addEventListener('click', () => {
                                    if (notif.instrument) {
                                        // Build URL dynamically using Django route pattern
                                        const url = `/order/create/${notif.instrument}/`;
                                        window.open(url, '_blank');
                                    }

                                    // Mark as read visually
                                    div.classList.remove('unread');
                                    div.classList.add('read');

                                    // Update badge count
                                    updateBadgeCount();
                                });

                                notificationList.appendChild(div);
                            });

                            updateBadgeCount();
                        } else {
                            const div = document.createElement('div');
                            div.className = 'notification-item';
                            div.textContent = 'No new notifications';
                            notificationList.appendChild(div);
                            notificationCount.textContent = '';
                        }
                    })
                    .catch(err => {
                        console.error('Error fetching notifications:', err);
                        notificationList.innerHTML = '<div class="notification-item">Failed to load notifications</div>';
                    });
            };

            // Update badge based on unread notifications
            const updateBadgeCount = () => {
                const unreadCount = document.querySelectorAll('.notification-item.unread').length;
                notificationCount.textContent = unreadCount > 0 ? unreadCount : '';
            };

            // Show popup and load notifications on click
            notificationBtn.addEventListener('click', (e) => {
                popup.style.display = 'block';
                loadNotifications();
                e.stopPropagation(); // Prevent popup from closing immediately
            });

            // Close popup
            closeBtn.addEventListener('click', () => {
                popup.style.display = 'none';
            });

            // Close popup when clicking outside
            window.addEventListener('click', (e) => {
                if (!popup.contains(e.target) && e.target !== notificationBtn) {
                    popup.style.display = 'none';
                }
            });

            // Optional: refresh notifications every 30s
            setInterval(() => {
                if (popup.style.display === 'block') loadNotifications();
            }, 30000);
        });
    </script>
</body>

</html>
